<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="https://bananayx.github.io/files/img/Banana头像.png" type="image/x-icon">
    <title>Banana Y.X. 静态资源库</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* ===== 全局变量 & 暗色模式 ===== */
        :root {
            --md-bg: #f5f5f7;
            --md-surface: rgba(255, 255, 255, 0.72);
            --md-surface-border: rgba(255, 255, 255, 0.30);
            --md-primary: #1976d2;
            --md-on-primary: #ffffff;
            --md-secondary: #9c27b0;
            --md-on-surface: #1d1d1f;
            --md-on-surface-variant: #3a3a3c;
            --md-elevation: 0 4px 20px rgba(0, 0, 0, 0.10), 0 2px 6px rgba(0, 0, 0, 0.06);
            --md-radius: 16px;
            --md-font: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --card-blur: blur(20px) saturate(180%);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --md-bg: #0f0f11;
                --md-surface: rgba(28, 28, 30, 0.72);
                --md-surface-border: rgba(255, 255, 255, 0.10);
                --md-primary: #90caf9;
                --md-on-primary: #0f0f11;
                --md-secondary: #ce93d8;
                --md-on-surface: #e8e8ea;
                --md-on-surface-variant: #a8a8aa;
                --md-elevation: 0 4px 20px rgba(0, 0, 0, 0.40), 0 2px 6px rgba(0, 0, 0, 0.20);
            }
        }

        /* ===== 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--md-font);
            background: var(--md-bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background 0.3s ease;
            margin: 0;
            position: relative;
        }

        /* ===== 毛玻璃卡片 ===== */
        .card {
            background: var(--md-surface);
            backdrop-filter: var(--card-blur);
            -webkit-backdrop-filter: var(--card-blur);
            border: 1px solid var(--md-surface-border);
            border-radius: var(--md-radius);
            box-shadow: var(--md-elevation);
            padding: 32px 28px 28px;
            max-width: 480px;
            width: 100%;
            transition: background 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        /* ===== 标题区域 ===== */
        .card-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 22px;
            padding-bottom: 18px;
            border-bottom: 2px solid var(--md-primary);
            transition: border-color 0.3s ease;
        }

        .card-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--md-primary);
            letter-spacing: 0.5px;
            transition: color 0.3s ease;
            line-height: 1.2;
            text-align: center;
        }

        /* ===== 内容区域 ===== */
        .card-body {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-top: 4px;
        }

        .description {
            font-size: 16px;
            font-weight: 400;
            color: var(--md-on-surface-variant);
            text-align: center;
            opacity: 0.85;
            transition: color 0.3s ease;
            padding: 0 4px;
        }

        /* ===== 链接按钮 ===== */
        .link-item {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px 18px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.04);
            transition: background 0.3s ease, transform 0.15s ease;
            text-decoration: none;
            margin-top: 4px;
        }

        .link-item:hover {
            transform: translateY(-1px);
            background: rgba(0, 0, 0, 0.08);
        }

        @media (prefers-color-scheme: dark) {
            .link-item {
                background: rgba(255, 255, 255, 0.05);
            }
            .link-item:hover {
                background: rgba(255, 255, 255, 0.10);
            }
        }

        .link-item .link-text {
            font-size: 16px;
            font-weight: 600;
            color: var(--md-primary);
            text-decoration: none;
            transition: color 0.2s ease;
            text-align: center;
            letter-spacing: 0.3px;
        }

        .link-item:hover .link-text {
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 480px) {
            .card {
                padding: 24px 18px 20px;
            }

            .card-header {
                gap: 10px;
                padding-bottom: 14px;
                margin-bottom: 18px;
            }

            .card-title {
                font-size: 22px;
            }

            .description {
                font-size: 14px;
            }

            .link-item {
                padding: 12px 14px;
            }

            .link-item .link-text {
                font-size: 14px;
            }

        @media (max-width: 360px) {
            .card {
                padding: 18px 14px 16px;
            }

            .card-title {
                font-size: 18px;
            }

            .description {
                font-size: 13px;
            }

            .link-item {
                padding: 10px 12px;
            }

            .link-item .link-text {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 主卡片 ===== -->
    <div class="card" role="main" aria-label="静态资源库卡片">
        <div class="card-header">
            <span class="card-title">Banana Y.X. 静态资源库</span>
        </div>

        <div class="card-body">
            <p class="description">我的静态资源库</p>
            <a class="link-item" href="https://bananayx.qzz.io" target="_blank" rel="noopener noreferrer">
                <span class="link-text">访问Banana Y.X.的小站</span>
            </a>
        </div>

</body>
</html>
